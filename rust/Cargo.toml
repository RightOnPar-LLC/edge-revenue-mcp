[package]
name = "edge-revenue-mcp"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
description = "Offline-first edge payments MCP — record sales into a local append-only ledger and sync them to Square via an outbox when connectivity returns. Runs on a Raspberry Pi at the venue."
repository = "https://github.com/RightOnPar-LLC/edge-revenue-mcp"

[[bin]]
name = "edge-revenue-mcp"
path = "src/main.rs"

[lib]
name = "edge_revenue_mcp"
path = "src/lib.rs"

[dependencies]
# local-first ledger (no external DB; same engine as agent-market / cognitive-mcp)
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
# MCP server (stdio transport)
rmcp = { version = "1.8", features = ["server", "macros", "transport-io"] }
schemars = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# plumbing
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
